<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NDA Clause Risk Analyzer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f0f12;
      --card-bg: #16161a;
      --border-color: rgba(255, 255, 255, 0.08);
      --accent-color: #c9a961;
      --accent-hover: #b89850;
      --text-main: #f3f4f6;
      --text-muted: #8e8e93;
      --text-subtle: #6e6e73;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 3.5rem 1.5rem;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 760px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 3.5rem;
    }

    .header {
      margin-bottom: 3rem;
      text-align: left;
    }

    .header h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 2.2rem;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 0.75rem;
      letter-spacing: -0.01em;
    }

    .header p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 2rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.75rem;
      color: var(--text-muted);
    }

    textarea {
      width: 100%;
      height: 150px;
      background-color: #0b0b0e;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 1.25rem;
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      line-height: 1.6;
      resize: vertical;
      transition: border-color 0.2s ease;
    }

    textarea:focus {
      outline: none;
      border-color: rgba(201, 169, 97, 0.5);
    }

    button {
      width: 100%;
      padding: 1rem;
      background-color: var(--accent-color);
      border: none;
      border-radius: 6px;
      color: #0f0f12;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .result-section {
      margin-top: 3rem;
      display: none;
      border-top: 1px solid var(--border-color);
      padding-top: 2.5rem;
    }

    .prediction-container {
      margin-bottom: 2.5rem;
    }

    .category-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .prediction-row {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .category-name {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 2rem;
      font-weight: 600;
      color: #ffffff;
    }

    .confidence-text {
      font-size: 1rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    .precedents-title {
      font-size: 0.85rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 1.25rem;
      color: var(--text-muted);
    }

    .precedent-card {
      background-color: #0b0b0e;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 1.5rem;
      margin-bottom: 1.25rem;
    }

    .precedent-card:last-child {
      margin-bottom: 0;
    }

    .precedent-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      font-size: 0.85rem;
    }

    .precedent-category {
      font-weight: 500;
      color: var(--accent-color);
    }

    .precedent-distance {
      color: var(--text-subtle);
      font-size: 0.8rem;
      font-family: monospace;
    }

    .precedent-text {
      font-size: 0.9rem;
      line-height: 1.6;
      color: #d1d5db;
    }

    .error-box {
      background: rgba(220, 38, 38, 0.1);
      border: 1px solid rgba(220, 38, 38, 0.25);
      color: #f87171;
      padding: 1rem 1.25rem;
      border-radius: 6px;
      margin-top: 2rem;
      display: none;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>NDA Clause Risk Analyzer</h1>
      <p>Classification and precedent retrieval for non-disclosure agreement provisions</p>
    </div>

    <form id="clauseForm">
      <div class="form-group">
        <label for="clauseText">Clause Provision Text</label>
        <textarea id="clauseText" placeholder="Paste NDA clause text here..." required></textarea>
      </div>

      <button type="submit" id="submitBtn">
        <span id="btnText">Analyze Clause</span>
      </button>
    </form>

    <div class="error-box" id="errorBox"></div>

    <div class="result-section" id="resultSection">
      <div class="prediction-container">
        <div class="category-title">Predicted Category</div>
        <div class="prediction-row">
          <div class="category-name" id="predictedCategory">-</div>
          <div class="confidence-text" id="confidenceValue"></div>
        </div>
      </div>

      <div class="precedents-title">Precedent Clauses</div>
      <div id="precedentsList"></div>
    </div>
  </div>

  <script>
    const form = document.getElementById('clauseForm');
    const textarea = document.getElementById('clauseText');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const resultSection = document.getElementById('resultSection');
    const predictedCategory = document.getElementById('predictedCategory');
    const confidenceValue = document.getElementById('confidenceValue');
    const precedentsList = document.getElementById('precedentsList');
    const errorBox = document.getElementById('errorBox');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = textarea.value.trim();
      if (!text) return;

      // Reset UI state
      errorBox.style.display = 'none';
      resultSection.style.display = 'none';
      submitBtn.disabled = true;
      btnText.textContent = 'Analyzing...';

      try {
        const response = await fetch('/analyze-clause', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ text })
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.detail || 'Analysis request failed.');
        }

        const data = await response.json();

        // Render Prediction
        predictedCategory.textContent = data.predicted_category;
        confidenceValue.textContent = `(${(data.confidence * 100).toFixed(1)}% confidence)`;

        // Render Precedents
        precedentsList.innerHTML = '';
        if (data.similar_precedents && data.similar_precedents.length > 0) {
          data.similar_precedents.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'precedent-card';
            card.innerHTML = `
              <div class="precedent-meta">
                <span class="precedent-category">#${index + 1} &bull; ${escapeHtml(item.category)}</span>
                <span class="precedent-distance">distance ${item.distance.toFixed(4)}</span>
              </div>
              <div class="precedent-text">${escapeHtml(item.text)}</div>
            `;
            precedentsList.appendChild(card);
          });
        } else {
          precedentsList.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">No matching precedent clauses found.</p>';
        }

        resultSection.style.display = 'block';
      } catch (err) {
        errorBox.textContent = err.message || 'An error occurred while connecting to the server.';
        errorBox.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        btnText.textContent = 'Analyze Clause';
      }
    });

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
